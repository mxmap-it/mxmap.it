name: EU Security Map (weekly)

# mxmap.it#33 — rescan settimanale dei domini email del settore sicurezza
# europeo (solo lookup DNS passivi) + rigenerazione di eu-security/.
# Indipendente dalla nightly IT: un fallimento qui non tocca mxmap.it.
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Scan mail domains (passive DNS)
        run: uv run python3 scripts/scan_eu_security.py
      - name: Build KPI + page (integrity asserted)
        run: uv run python3 scripts/build_eu_security_page.py
      - name: Commit results (best-effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eu_security/entities.json data/eu_security/results.json data/dns_cache/eusec.json eu-security/ || true
          git diff --cached --quiet || git commit -m "chore: EU Security Map weekly rescan"
          git pull --rebase && git push
